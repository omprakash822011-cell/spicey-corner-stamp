<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e4572e">
<title>Spicey Corner Stamp Card</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fff7f0;--card:#ffffff;--ink:#2a1a12;--accent:#e4572e;--muted:#8a7468;--ok:#2e8b57}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1410;--card:#2a201b;--ink:#f5ebe4;--accent:#ff7a4d;--muted:#b09d92;--ok:#4cc17f}}
:root[data-theme="dark"]{--bg:#1b1410;--card:#2a201b;--ink:#f5ebe4;--accent:#ff7a4d;--muted:#b09d92;--ok:#4cc17f}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:16px;margin:6px 0;background:var(--card);color:var(--ink)}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
button:disabled{opacity:.5}
.link{background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px;margin-top:6px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.s{aspect-ratio:1;border-radius:50%;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
.s.on{background:var(--ok);border:2px solid var(--ok);color:#fff}
.menu img{width:100%;border-radius:10px;margin:6px 0}
.menu li{margin:4px 0}
.msg{color:var(--muted);font-size:14px;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="shopName">Spicey Corner</h1>

  <div class="card" id="formCard">
    <h2>Stamp card-ah paarka</h2>
    <p class="msg">Unga peru & phone number kudunga.</p>
    <form id="form">
      <input id="name" placeholder="Peru" required>
      <input id="phone" placeholder="Phone number (10 digit)" inputmode="numeric" required>
      <label class="msg" style="display:flex;gap:8px;align-items:flex-start;margin-top:8px">
        <input type="checkbox" id="consent" required style="width:auto;margin:3px 0 0">
        <span>Stamp card-kaaga phone number save panradhukku sammadhikkiren</span>
      </label>
      <button type="submit">Continue</button>
    </form>
  </div>

  <div class="card hidden" id="cardCard">
    <h2 id="hello"></h2>
    <div class="stamps" id="stamps"></div>
    <p id="status" class="msg"></p>
    <p id="reward" class="msg"></p>
    <button class="link" id="reset">Vera phone number-la paarka</button>
  </div>

  <div class="card">
    <h3>Menu</h3>
    <div class="menu" id="menu"><p class="msg">Loading...</p></div>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDY0jtEf8YFc9dZVA6JOD6i-SoQ4gxDDtE",
  authDomain: "spicey-corner.firebaseapp.com",
  projectId: "spicey-corner",
  storageBucket: "spicey-corner.firebasestorage.app",
  messagingSenderId: "195020607057",
  appId: "1:195020607057:web:e62be134ff50959b747270"
});
const db = firebase.firestore();
const SHOP_ID = new URLSearchParams(location.search).get('shop') || 'spicey-corner';
const $ = id => document.getElementById(id);
const todayIST = () => new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TARGET = 10, unsub = null;

async function loadShop() {
  try {
    const snap = await db.collection('shops').doc(SHOP_ID).get();
    const s = snap.data() || {};
    if (s.name) $('shopName').textContent = s.name;
    TARGET = s.stampTarget || 10;
    const menu = Array.isArray(s.menu) ? s.menu : [];
    const imgs = Array.isArray(s.images) ? s.images : [];
    $('menu').innerHTML =
      imgs.map(u => `<img src="${esc(u)}" alt="">`).join('') +
      (menu.length
        ? '<ul>' + menu.map(m => `<li>${esc(m.name)}${m.price ? ' – ₹' + esc(m.price) : ''}</li>`).join('') + '</ul>'
        : '<p class="msg">Menu innum update aagala.</p>');
  } catch (e) {
    $('menu').innerHTML = '<p class="msg">Shop details load aagala.</p>';
  }
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim();
  const phone = $('phone').value.replace(/\D/g, '').slice(-10);
  if (phone.length !== 10) return alert('10 digit phone number kudunga');
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const q = await db.collection('customers').where('phone', '==', phone).limit(1).get();
    let id;
    if (q.empty) {
      const ref = await db.collection('customers').add({
        name, phone, stamps: 0, lastStampDate: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      id = ref.id;
    } else {
      id = q.docs[0].id;
    }
    localStorage.setItem('sc_customer', id);
    watch(id);
  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

function watch(id) {
  if (unsub) unsub();
  $('formCard').classList.add('hidden');
  $('cardCard').classList.remove('hidden');
  unsub = db.collection('customers').doc(id).onSnapshot(snap => {
    if (!snap.exists) { localStorage.removeItem('sc_customer'); location.reload(); return; }
    render(snap.data());
  }, err => alert(err.message));
}

function render(c) {
  const n = Math.min(c.stamps || 0, TARGET);
  $('hello').textContent = `Vanakkam, ${c.name || ''}!`;
  let html = '';
  for (let i = 1; i <= TARGET; i++) html += `<div class="s ${i <= n ? 'on' : ''}">${i <= n ? '✓' : i}</div>`;
  $('stamps').innerHTML = html;
  $('status').textContent = c.lastStampDate === todayIST()
    ? 'Innaiku stamp vaangitteenga ✅'
    : 'Innaiku stamp innum vaangala. Kadaila kaattunga.';
  $('reward').textContent = n >= TARGET
    ? '🎉 Free offer unlock aagiduchu! Kadaila kaattunga.'
    : `Innum ${TARGET - n} stamp irundha free offer!`;
}

$('reset').addEventListener('click', () => {
  localStorage.removeItem('sc_customer');
  location.reload();
});

loadShop();
const saved = localStorage.getItem('sc_customer');
if (saved) watch(saved);
</script>
</body>
</html>
